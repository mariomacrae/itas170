# default.conf — one server block. nginx reads every *.conf in
# /etc/nginx/conf.d/; this file replaces the image's default.
#
# Every directive ends in a semicolon. Blocks use braces. Test with
# nginx -t before you trust it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
    location /admin/ {
    auth_basic "admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

    location /docs/ {
        autoindex on;
    }

    location /api/ {
        proxy_pass http://whoami:80/;
        proxy_set_header Host $host;
    }
}

