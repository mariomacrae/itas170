# compose.yml — two services, one network.
#
#   docker compose up -d --build     start (building the web image)
#   docker compose ps                what is running
#   docker compose logs -f web       follow the web server's log
#   docker compose down              stop and remove everything
#
# On the Docker host, change "8080" to YOUR assigned port from ports.md.
services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - whoami
  whoami:
    image: traefik/whoami
