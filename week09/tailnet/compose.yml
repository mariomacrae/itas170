# Part 4b — the same site, reachable on YOUR tailnet with a real certificate.
#
# Two services. `tailnet` is the Tailscale sidecar: it joins your tailnet
# under the name in TS_HOSTNAME and, because of serve.json, answers HTTPS
# on 443 and hands the traffic to port 80 *inside the same network
# namespace*. `web` has no ports: line of its own — it shares the sidecar's
# network (network_mode), so "port 80 here" is the sidecar's port 80.
#
# TS_AUTHKEY comes from .env, which git ignores. It is a real secret.
services:
  tailnet:
    image: tailscale/tailscale:latest
    hostname: itas170-site
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailnet-state:/var/lib/tailscale   # node identity survives restarts
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    network_mode: service:tailnet   # no ports: of its own — it shares the sidecar's
    volumes:
      - ../site:/usr/share/nginx/html:ro
    depends_on:
      - tailnet
    restart: unless-stopped

volumes:
  tailnet-state:
